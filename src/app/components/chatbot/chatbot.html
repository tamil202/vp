<button
  class="chat-toggle"
  [class.open]="isOpen()"
  (click)="toggle()"
  aria-haspopup="dialog"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-label]="isOpen() ? 'Close chat assistant' : 'Ask about Vishnuprabha'">
  @if (!isOpen()) {
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </svg>
    <span class="chat-toggle-badge">AI</span>
  } @else {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  }
</button>

@if (isOpen()) {
  <div class="chat-panel" role="dialog" aria-label="Ask about Vishnuprabha">
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-avatar">VP</span>
        <div class="chat-header-text">
          <h4>Ask about Vishnuprabha</h4>
          <span class="chat-status"><span class="status-dot"></span>Instant answers from her resume</span>
        </div>
      </div>
      <button class="chat-close" (click)="close()" aria-label="Close chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="chat-messages">
      @for (msg of messages(); track $index) {
        <div class="chat-bubble" [class.user]="msg.role === 'user'" [class.bot]="msg.role === 'bot'">
          {{ msg.text }}
        </div>
      }
      @if (isTyping()) {
        <div class="chat-bubble bot typing" aria-label="Assistant is typing">
          <span></span><span></span><span></span>
        </div>
      }
      <div #scrollAnchor></div>
    </div>

    <div class="chat-suggestions">
      @for (s of suggestions; track s) {
        <button class="suggestion-chip" (click)="ask(s)">{{ s }}</button>
      }
    </div>

    <form class="chat-input-row" (ngSubmit)="onSubmit()">
      <input
        type="text"
        [(ngModel)]="inputText"
        name="chatInput"
        placeholder="Ask a question…"
        autocomplete="off">
      <button type="submit" class="chat-send" [disabled]="!inputText.trim()" aria-label="Send message">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <div class="chat-disclaimer">Automated assistant · answers sourced from the resume, not a live AI model</div>
  </div>
}
